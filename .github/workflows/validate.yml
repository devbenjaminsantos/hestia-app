name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore finance-dashboard-react.sln
      - run: dotnet build finance-dashboard-react.sln --configuration Release --no-restore
      - run: dotnet test tests/FinanceDashboard.Api.Tests/FinanceDashboard.Api.Tests.csproj --configuration Release --no-build --no-restore
      - name: Fail on vulnerable NuGet dependencies
        run: |
          dotnet list finance-dashboard-react.sln package --vulnerable --include-transitive --format json > vulnerable-packages.json
          jq -e '[.. | objects | .vulnerabilities? | arrays | .[]] | length == 0' vulnerable-packages.json

  backup-restore:
    name: PostgreSQL backup and restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hestia
          POSTGRES_PASSWORD: hestia_ci_only
          POSTGRES_DB: hestia_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hestia -d hestia_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Migrate the disposable source database
        env:
          ConnectionStrings__Default: Host=127.0.0.1;Database=hestia_source;Username=hestia;Password=hestia_ci_only
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/ef" dotnet-ef --version 10.0.14
          "$RUNNER_TEMP/ef/dotnet-ef" database update --project server/FinanceDashboard.Api
      - name: Restore the application schema and verify related data
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" env PGUSER=hestia sh < .github/scripts/restore-drill.sh
      - name: Test concurrent financial writes against the restored database
        env:
          HESTIA_TEST_POSTGRES: Host=127.0.0.1;Database=hestia_restore;Username=hestia;Password=hestia_ci_only
        run: dotnet test tests/FinanceDashboard.Api.Tests --configuration Release --filter Database=PostgreSQL
